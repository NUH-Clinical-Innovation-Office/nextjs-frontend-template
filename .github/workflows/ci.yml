name: CI/CD

on:
  push:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  extract-bun-version:
    name: Extract Bun Version from package.json
    runs-on: ubuntu-latest
    outputs:
      bun_version: ${{ steps.get-bun-version.outputs.bun_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get Bun version from package.json
        id: get-bun-version
        run: |
          BUN_VERSION=$(grep -o '"packageManager": *"bun@[^"]*"' package.json | sed 's/.*bun@//;s/"//')
          echo "bun_version=${BUN_VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: Quality Checks
    permissions:
      contents: read
      security-events: write
    needs: extract-bun-version
    uses: ./.github/workflows/reusable-build.yml
    with:
      bun_version: ${{ needs.extract-bun-version.outputs.bun_version }}

  docker:
    name: Build & Push Docker Image
    needs: [build, extract-bun-version]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-docker.yml
    with:
      bun_version: ${{ needs.extract-bun-version.outputs.bun_version }}
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  security-scan:
    name: Security Scan
    needs: docker
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/reusable-security-scan.yml
    with:
      image_tag: ${{ needs.docker.outputs.image_tag }}
    secrets: inherit

  deploy-feature:
    name: Deploy Feature Branch
    if: github.ref != 'refs/heads/main'
    needs: [docker, security-scan]
    permissions:
      contents: read
      packages: read
      deployments: write
    uses: ./.github/workflows/feature-deploy.yml
    with:
      image_tag: ${{ needs.docker.outputs.image_tag }}
    secrets: inherit

  deploy-staging:
    name: Deploy to Staging
    if: github.ref == 'refs/heads/main'
    needs: [docker, security-scan, extract-bun-version]
    permissions:
      contents: read
      packages: read
      deployments: write
    uses: ./.github/workflows/staging-deploy.yml
    with:
      image_tag: ${{ needs.docker.outputs.image_tag }}
      bun_version: ${{ needs.extract-bun-version.outputs.bun_version }}
    secrets: inherit

  deploy-production:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'
    needs: [deploy-staging, docker, security-scan, extract-bun-version]
    permissions:
      contents: read
      packages: read
      deployments: write
    uses: ./.github/workflows/production-deploy.yml
    with:
      image_tag: ${{ needs.docker.outputs.image_tag }}
      bun_version: ${{ needs.extract-bun-version.outputs.bun_version }}
    secrets: inherit

