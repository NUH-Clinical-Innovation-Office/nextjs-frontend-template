name: Feature Branch Deploy

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Deploy Feature Branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: preview-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      deployments: write
    outputs:
      branch_name: ${{ github.ref_name }}
      node_port: ${{ steps.allocate-port.outputs.PORT }}
      deployment_url: https://${{ steps.branch-name.outputs.HOST_LABEL }}.${{ vars.CLOUDFLARE_DOMAIN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate required secrets
        run: |
          MISSING_SECRETS=()

          if [ -z "${{ secrets.KUBECONFIG_SERVER }}" ]; then
            MISSING_SECRETS+=("KUBECONFIG_SERVER")
          fi
          if [ -z "${{ secrets.KUBECONFIG_TOKEN }}" ]; then
            MISSING_SECRETS+=("KUBECONFIG_TOKEN")
          fi
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            MISSING_SECRETS+=("CLOUDFLARE_API_TOKEN")
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            MISSING_SECRETS+=("CLOUDFLARE_ACCOUNT_ID")
          fi
          if [ -z "${{ secrets.CLOUDFLARE_TUNNEL_ID }}" ]; then
            MISSING_SECRETS+=("CLOUDFLARE_TUNNEL_ID")
          fi
          if [ -z "${{ vars.CLOUDFLARE_DOMAIN }}" ]; then
            MISSING_SECRETS+=("CLOUDFLARE_DOMAIN")
          fi

          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo "✗ ERROR: Missing required secrets:"
            printf '  - %s\n' "${MISSING_SECRETS[@]}"
            echo ""
            echo "Please configure these secrets in your repository settings."
            exit 1
          fi

          echo "✓ All required secrets are configured"

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: "v3.13.0"

      - name: Setup Kubernetes config
        env:
          KUBE_SERVER: ${{ secrets.KUBECONFIG_SERVER }}
          KUBE_TOKEN: ${{ secrets.KUBECONFIG_TOKEN }}
        run: |
          mkdir -p ~/.kube
          touch ~/.kube/config
          chmod 600 ~/.kube/config
          # Cluster API is fronted by a proxied Cloudflare tunnel hostname,
          # so the client sees Cloudflare's trusted cert (normal TLS verify).
          kubectl config set-cluster prod --server="$KUBE_SERVER"
          kubectl config set-credentials deployer --token="$KUBE_TOKEN"
          kubectl config set-context prod --cluster=prod --user=deployer
          kubectl config use-context prod

      - name: Determine preview identity
        id: branch-name
        env:
          PREVIEW_BRANCH: ${{ github.ref_name }}
        run: python3 .github/scripts/preview_identity.py

      - name: Copy GHCR secret to feature namespace
        run: |
          NAMESPACE="${{ steps.branch-name.outputs.NAMESPACE }}"

          # Create namespace only if it doesn't exist (avoids patching pre-existing ns)
          kubectl get namespace "$NAMESPACE" &>/dev/null || \
            kubectl create namespace "$NAMESPACE"

          # Copy ghcr-secret from main namespace to feature namespace only if it doesn't exist
          if ! kubectl get secret ghcr-secret -n "$NAMESPACE" &>/dev/null; then
            kubectl get secret ghcr-secret -n ${{ github.event.repository.name }} -o yaml | \
              sed "s/namespace: ${{ github.event.repository.name }}/namespace: $NAMESPACE/" | \
              kubectl apply -f -
            echo "✓ Copied ghcr-secret to $NAMESPACE"
          else
            echo "✓ Secret ghcr-secret already exists in $NAMESPACE"
          fi

      - name: Deploy with Helm
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          NAMESPACE="${{ steps.branch-name.outputs.NAMESPACE }}"

          helm upgrade --install ${{ steps.branch-name.outputs.RELEASE }} ./helm/nextjs-app \
            -n "$NAMESPACE" \
            --create-namespace \
            -f ./helm/nextjs-app/values-feature.yaml \
            --set image.tag=${{ inputs.image_tag }} \
            --set "image.repository=${{ env.REGISTRY }}/${IMAGE_NAME_LOWER}" \
            --set service.nodePort=0 \
            --wait \
            --timeout 10m

      - name: Read allocated feature port
        id: allocate-port
        env:
          PREVIEW_NAMESPACE: ${{ steps.branch-name.outputs.NAMESPACE }}
          PREVIEW_RELEASE: ${{ steps.branch-name.outputs.RELEASE }}
        run: |
          PORT=$(kubectl get service "${PREVIEW_RELEASE}" -n "${PREVIEW_NAMESPACE}" \
            -o jsonpath='{.spec.ports[?(@.name=="http")].nodePort}')
          if ! [[ "$PORT" =~ ^[0-9]+$ ]] || [ "$PORT" -eq 0 ]; then
            echo "::error::The feature Service has no allocated NodePort"
            exit 1
          fi
          echo "PORT=$PORT" >> "$GITHUB_OUTPUT"

      - name: Verify deployment
        run: |
          NAMESPACE="${{ steps.branch-name.outputs.NAMESPACE }}"
          kubectl rollout status deployment/${{ steps.branch-name.outputs.RELEASE }} -n "$NAMESPACE" --timeout=1m

      - name: Create Cloudflare Tunnel route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
          TUNNEL_HOSTNAME: ${{ steps.branch-name.outputs.HOST_LABEL }}.${{ vars.CLOUDFLARE_DOMAIN }}
          TUNNEL_SERVICE: http://localhost:${{ steps.allocate-port.outputs.PORT }}
        run: python3 .github/scripts/tunnel_route.py

      - name: Create Cloudflare DNS record
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
          CLOUDFLARE_DOMAIN: ${{ vars.CLOUDFLARE_DOMAIN }}
        run: |
          FULL_HOSTNAME="${{ steps.branch-name.outputs.HOST_LABEL }}.${CLOUDFLARE_DOMAIN}"

          echo "Creating DNS CNAME record for: $FULL_HOSTNAME"

          # Get Zone ID for the domain
          ZONE_RESPONSE=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/zones?name=${CLOUDFLARE_DOMAIN}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json")

          ZONE_ID=$(echo "$ZONE_RESPONSE" | jq -r '.result[0].id')

          if [ -z "$ZONE_ID" ] || [ "$ZONE_ID" = "null" ]; then
            echo "✗ Failed to get Zone ID for domain: $CLOUDFLARE_DOMAIN"
            echo "$ZONE_RESPONSE" | jq '.'
            exit 1
          fi

          echo "✓ Found Zone ID: $ZONE_ID"

          # Check if DNS record already exists
          EXISTING_RECORD=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=CNAME&name=${FULL_HOSTNAME}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json")

          RECORD_ID=$(echo "$EXISTING_RECORD" | jq -r '.result[0].id // empty')

          if [ -n "$RECORD_ID" ]; then
            echo "✓ DNS record already exists, updating it"
            UPDATE_RESPONSE=$(curl -s -X PUT \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{
                \"type\": \"CNAME\",
                \"name\": \"${FULL_HOSTNAME}\",
                \"content\": \"${CLOUDFLARE_TUNNEL_ID}.cfargotunnel.com\",
                \"ttl\": 1,
                \"proxied\": true
              }")

            if echo "$UPDATE_RESPONSE" | jq -e '.success == true' >/dev/null 2>&1; then
              echo "✓ Successfully updated DNS record for $FULL_HOSTNAME"
            else
              echo "✗ Failed to update DNS record"
              echo "$UPDATE_RESPONSE" | jq '.'
              exit 1
            fi
          else
            echo "Creating new DNS record"
            CREATE_RESPONSE=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{
                \"type\": \"CNAME\",
                \"name\": \"${FULL_HOSTNAME}\",
                \"content\": \"${CLOUDFLARE_TUNNEL_ID}.cfargotunnel.com\",
                \"ttl\": 1,
                \"proxied\": true
              }")

            if echo "$CREATE_RESPONSE" | jq -e '.success == true' >/dev/null 2>&1; then
              echo "✓ Successfully created DNS record for $FULL_HOSTNAME"
            else
              echo "✗ Failed to create DNS record"
              echo "$CREATE_RESPONSE" | jq '.'
              exit 1
            fi
          fi

      - name: Create GitHub deployment
        uses: actions/github-script@v9
        env:
          DEPLOYMENT_URL: https://${{ steps.branch-name.outputs.HOST_LABEL }}.${{ vars.CLOUDFLARE_DOMAIN }}
        with:
          script: |
            const deploymentUrl = process.env.DEPLOYMENT_URL;
            const branchName = context.ref.replace('refs/heads/', '');

            // Create deployment
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: branchName,
              transient_environment: true,
              production_environment: false,
              auto_merge: false,
              required_contexts: []
            });

            // Create deployment status
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: 'success',
              environment_url: deploymentUrl,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

            console.log(`✓ Deployment created: ${deploymentUrl}`);
