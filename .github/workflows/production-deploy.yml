name: Production Deploy (AWS EKS)

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        type: string
      registry:
        description: "Container registry"
        required: false
        type: string
        default: "ghcr.io"
      image_name:
        description: "Image name (defaults to repository name)"
        required: false
        type: string
        default: ""
      namespace:
        description: "Kubernetes namespace"
        required: false
        type: string
        default: "sample-services"
    secrets:
      COMMON_SERVICE_URL:
        description: >-
          Optional override for the cluster-internal base URL of
          common-service. Leave unset to use the in-chart default
          (http://common-service.sample-services.svc.cluster.local:8080).
        required: false
      AWS_ROLE_ARN:
        description: "AWS role ARN for OIDC authentication"
        required: true

jobs:
  deploy:
    name: Deploy to AWS EKS Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://client-sample.russellgpt.com
    permissions:
      contents: read # Checkout repository code and Helm charts
      packages: read # Pull Docker images from GitHub Container Registry
      deployments: write # Create GitHub deployment status
      id-token: write # Authenticate with AWS via OIDC
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Determine image tag
        id: image-tag
        run: |
          IMAGE_TAG="${{ inputs.image_tag }}"

          if [ -z "$IMAGE_TAG" ]; then
            echo "ERROR: IMAGE_TAG is empty. Cannot proceed with deployment."
            exit 1
          fi

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Using image tag: $IMAGE_TAG"

      - name: Validate required secrets and variables
        run: |
          MISSING_SECRETS=()

          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            MISSING_SECRETS+=("AWS_ROLE_ARN")
          fi
          if [ -z "${{ vars.AWS_REGION }}" ]; then
            MISSING_SECRETS+=("AWS_REGION (variable)")
          fi
          if [ -z "${{ vars.EKS_CLUSTER_NAME }}" ]; then
            MISSING_SECRETS+=("EKS_CLUSTER_NAME (variable)")
          fi

          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo "✗ ERROR: Missing required secrets/variables:"
            printf '  - %s\n' "${MISSING_SECRETS[@]}"
            echo ""
            echo "Please configure these in your repository settings:"
            echo "  Secrets: AWS_ROLE_ARN"
            echo "  Variables: AWS_REGION, EKS_CLUSTER_NAME"
            exit 1
          fi

          echo "✓ All required secrets and variables are configured"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Verify AWS credentials
        run: |
          aws sts get-caller-identity
          echo "✓ AWS credentials verified"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.0"

      - name: Update kubeconfig for EKS
        run: |
          echo "Updating kubeconfig for EKS cluster: ${{ vars.EKS_CLUSTER_NAME }}"
          aws eks update-kubeconfig \
            --region ${{ vars.AWS_REGION }} \
            --name ${{ vars.EKS_CLUSTER_NAME }}

          kubectl cluster-info
          echo "✓ Successfully connected to EKS cluster"

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ inputs.namespace }} --dry-run=client -o yaml | kubectl apply -f -
          echo "✓ Namespace ${{ inputs.namespace }} ready"

      - name: Verify GHCR credentials secret exists
        run: |
          if ! kubectl get secret ghcr-credentials -n ${{ inputs.namespace }} &>/dev/null; then
            echo "✗ ERROR: Secret 'ghcr-credentials' not found in '${{ inputs.namespace }}' namespace"
            echo ""
            echo "Please create the secret using:"
            echo "  kubectl create secret docker-registry ghcr-credentials \\"
            echo "    --docker-server=ghcr.io \\"
            echo "    --docker-username=<github-username> \\"
            echo "    --docker-password=<github-token> \\"
            echo "    --namespace=${{ inputs.namespace }}"
            exit 1
          fi
          echo "✓ GHCR credentials secret found in ${{ inputs.namespace }} namespace"

      - name: Verify common-service API key secret exists
        run: |
          # values-production.yaml mounts this Secret into the pod. Checking it
          # here turns a CrashLoopBackOff into an actionable deploy failure.
          if ! kubectl get secret client-sample-common-service -n ${{ inputs.namespace }} &>/dev/null; then
            echo "✗ ERROR: Secret 'client-sample-common-service' not found in '${{ inputs.namespace }}' namespace"
            echo ""
            echo "This holds the developer API key used to authenticate against"
            echo "common-service as a Consumer Backend. Create it using:"
            echo "  kubectl create secret generic client-sample-common-service \\"
            echo "    --from-literal=api-key=<developer-api-key> \\"
            echo "    --namespace=${{ inputs.namespace }}"
            exit 1
          fi
          echo "✓ common-service API key secret found in ${{ inputs.namespace }} namespace"

      - name: Deploy with Helm
        run: |
          if [ -n "${{ inputs.image_name }}" ]; then
            IMAGE_NAME="${{ inputs.image_name }}"
          else
            IMAGE_NAME="${{ github.repository }}"
          fi
          IMAGE_NAME_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')

          echo "Deploying client-sample to production..."
          echo "Image: ${{ inputs.registry }}/${IMAGE_NAME_LOWER}:${{ steps.image-tag.outputs.IMAGE_TAG }}"

          # Only override COMMON_SERVICE_URL when the secret is actually set.
          # Passing an empty --set-string would append an empty env entry that
          # wins over the chart default and break every upstream call, so the
          # override has to be conditional rather than unconditional.
          COMMON_SERVICE_URL_OVERRIDE="${{ secrets.COMMON_SERVICE_URL }}"
          EXTRA_ARGS=()
          if [ -n "$COMMON_SERVICE_URL_OVERRIDE" ]; then
            EXTRA_ARGS+=(--set-string "extraEnv[0].name=COMMON_SERVICE_URL")
            EXTRA_ARGS+=(--set-string "extraEnv[0].value=$COMMON_SERVICE_URL_OVERRIDE")
            echo "COMMON_SERVICE_URL: overridden by repository secret"
          else
            echo "COMMON_SERVICE_URL: using chart default"
          fi

          helm upgrade --install client-sample ./helm/nextjs-app \
            -n ${{ inputs.namespace }} \
            --create-namespace \
            -f ./helm/nextjs-app/values-production.yaml \
            --set-string "image.tag=${{ steps.image-tag.outputs.IMAGE_TAG }}" \
            --set-string "image.repository=${{ inputs.registry }}/${IMAGE_NAME_LOWER}" \
            "${EXTRA_ARGS[@]}" \
            --wait \
            --timeout 10m

          echo "✓ Helm deployment completed"

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/client-sample -n ${{ inputs.namespace }} --timeout=5m

          echo ""
          echo "Deployment status:"
          kubectl get deployment client-sample -n ${{ inputs.namespace }}

          echo ""
          echo "Pod status:"
          kubectl get pods -n ${{ inputs.namespace }} -l app.kubernetes.io/name=nextjs-app

          echo "✓ Deployment verification completed"

      - name: Display deployment summary
        run: |
          if [ -n "${{ inputs.image_name }}" ]; then
            IMAGE_NAME="${{ inputs.image_name }}"
          else
            IMAGE_NAME="${{ github.repository }}"
          fi
          IMAGE_NAME_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')

          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  Production Deployment Summary"
          echo "════════════════════════════════════════════════════════"
          echo ""
          echo "Cluster:    ${{ vars.EKS_CLUSTER_NAME }}"
          echo "Region:     ${{ vars.AWS_REGION }}"
          echo "Namespace:  ${{ inputs.namespace }}"
          echo "Image:      ${{ inputs.registry }}/${IMAGE_NAME_LOWER}:${{ steps.image-tag.outputs.IMAGE_TAG }}"
          echo "URL:        https://client-sample.russellgpt.com"
          echo ""
          echo "✓ Production deployment completed successfully!"
