name: Feature Branch Cleanup

on:
  delete:

jobs:
  cleanup:
    name: Cleanup Feature Branch Deployment
    if: github.event.ref_type == 'branch' && github.event.ref != 'main'
    concurrency:
      group: preview-${{ github.repository }}-${{ github.event.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate required secrets
        run: |
          MISSING_SECRETS=()

          if [ -z "${{ secrets.KUBECONFIG_SERVER }}" ]; then
            MISSING_SECRETS+=("KUBECONFIG_SERVER")
          fi
          if [ -z "${{ secrets.KUBECONFIG_TOKEN }}" ]; then
            MISSING_SECRETS+=("KUBECONFIG_TOKEN")
          fi

          # Cloudflare secrets are optional since the step is conditional
          # but we'll warn if they're missing
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "⚠ WARNING: CLOUDFLARE_API_TOKEN is not set. Cloudflare cleanup will be skipped."
          fi

          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo "✗ ERROR: Missing required secrets:"
            printf '  - %s\n' "${MISSING_SECRETS[@]}"
            echo ""
            echo "Please configure these secrets in your repository settings."
            exit 1
          fi

          echo "✓ All required secrets are configured"

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: "v3.13.0"

      - name: Setup Kubernetes config
        env:
          KUBE_SERVER: ${{ secrets.KUBECONFIG_SERVER }}
          KUBE_TOKEN: ${{ secrets.KUBECONFIG_TOKEN }}
        run: |
          mkdir -p ~/.kube
          touch ~/.kube/config
          chmod 600 ~/.kube/config
          # Cluster API is fronted by a proxied Cloudflare tunnel hostname,
          # so the client sees Cloudflare's trusted cert (normal TLS verify).
          kubectl config set-cluster prod --server="$KUBE_SERVER"
          kubectl config set-credentials deployer --token="$KUBE_TOKEN"
          kubectl config set-context prod --cluster=prod --user=deployer
          kubectl config use-context prod

      - name: Determine preview identity
        id: branch-name
        env:
          PREVIEW_BRANCH: ${{ github.event.ref }}
        run: python3 .github/scripts/preview_identity.py

      - name: Delete Helm release
        run: |
          NAMESPACE="${{ steps.branch-name.outputs.NAMESPACE }}"

          if helm list -n "$NAMESPACE" | grep -q "${{ steps.branch-name.outputs.RELEASE }}"; then
            echo "Deleting Helm release..."
            helm uninstall ${{ steps.branch-name.outputs.RELEASE }} -n "$NAMESPACE" || true
          else
            echo "No Helm release found, skipping..."
          fi

      - name: Delete namespace
        run: |
          NAMESPACE="${{ steps.branch-name.outputs.NAMESPACE }}"

          if kubectl get namespace "$NAMESPACE" 2>/dev/null; then
            echo "Deleting namespace $NAMESPACE..."
            kubectl delete namespace "$NAMESPACE" --timeout=2m || true
          else
            echo "Namespace not found, skipping..."
          fi

      - name: Remove Cloudflare Tunnel route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
          TUNNEL_HOSTNAME: ${{ steps.branch-name.outputs.HOST_LABEL }}.${{ vars.CLOUDFLARE_DOMAIN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_TUNNEL_ID" ]; then
            echo "Cloudflare credentials are incomplete. Skipping tunnel cleanup."
            exit 0
          fi
          python3 .github/scripts/tunnel_route.py

      - name: Remove Cloudflare DNS record
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DOMAIN: ${{ vars.CLOUDFLARE_DOMAIN }}
        run: |
          FULL_HOSTNAME="${{ steps.branch-name.outputs.HOST_LABEL }}.${CLOUDFLARE_DOMAIN}"

          echo "Attempting to remove Cloudflare DNS record for: $FULL_HOSTNAME"

          # Get Zone ID for the domain
          ZONE_RESPONSE=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/zones?name=${CLOUDFLARE_DOMAIN}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json")

          ZONE_ID=$(echo "$ZONE_RESPONSE" | jq -r '.result[0].id')

          if [ -z "$ZONE_ID" ] || [ "$ZONE_ID" = "null" ]; then
            echo "⚠ WARNING: Could not get Zone ID for domain: $CLOUDFLARE_DOMAIN"
            echo "$ZONE_RESPONSE" | jq '.'
          else
            # Check if DNS record exists
            EXISTING_RECORD=$(curl -s -X GET \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=CNAME&name=${FULL_HOSTNAME}" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json")

            RECORD_ID=$(echo "$EXISTING_RECORD" | jq -r '.result[0].id // empty')

            if [ -n "$RECORD_ID" ]; then
              DELETE_RESPONSE=$(curl -s -X DELETE \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json")

              if echo "$DELETE_RESPONSE" | jq -e '.success == true' >/dev/null 2>&1; then
                echo "✓ Successfully removed DNS record for $FULL_HOSTNAME"
              else
                echo "⚠ WARNING: Failed to delete DNS record"
                echo "$DELETE_RESPONSE" | jq '.'
              fi
            else
              echo "✓ DNS record not found (may have been already removed)"
            fi
          fi

      - name: Deactivate GitHub deployment
        uses: actions/github-script@v9
        with:
          script: |
            const branchName = context.payload.ref;
            const environmentName = branchName;

            try {
              // Get all deployments for this environment
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment: environmentName
              });

              // Mark all deployments as inactive
              for (const deployment of deployments) {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  state: 'inactive'
                });

                console.log(`✓ Deactivated deployment ${deployment.id}`);
              }

              console.log(`✓ Cleaned up ${deployments.length} deployment(s) for environment: ${environmentName}`);
            } catch (error) {
              console.log(`⚠ Warning: Could not deactivate deployments: ${error.message}`);
            }

      - name: Delete GitHub environment
        uses: actions/github-script@v9
        with:
          script: |
            const branchName = context.payload.ref;
            const environmentName = branchName;

            try {
              await github.rest.repos.deleteAnEnvironment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment_name: environmentName
              });

              console.log(`✓ Deleted environment: ${environmentName}`);
            } catch (error) {
              if (error.status === 404) {
                console.log(`✓ Environment not found (may have been already deleted): ${environmentName}`);
              } else {
                console.log(`⚠ Warning: Could not delete environment: ${error.message}`);
              }
            }
