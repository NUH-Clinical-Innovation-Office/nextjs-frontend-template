# Default values for nextjs-app
replicaCount: 2

image:
  repository: nextjs-frontend-template
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

# Common labels for cost allocation and resource organization
commonLabels: {}
  # team: "frontend-team"
  # project: "nextjs-frontend-template"
  # cost-center: "engineering"
  # environment: "production"

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

service:
  type: NodePort
  port: 3000
  targetPort: 3000

ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: nextjs-app-tls
      hosts:
        - chart-example.local

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Bun runtime tuning.
# Bun runs on JavaScriptCore, which ignores V8 flags such as
# `--max-old-space-size`. Use `--smol` instead: it makes the GC run more
# eagerly and keeps the heap small, which is what we want under the tight
# container memory limits (256Mi) this chart ships by default.
# Disable it in memory-rich environments where throughput matters more than
# resident size.
bunOptions:
  smol: true

# Prometheus metrics exposure.
# App serves metrics on a dedicated port (not via ingress). Discovery is via a
# ServiceMonitor (Prometheus Operator / kube-prometheus-stack).
metrics:
  enabled: true
  port: 9464
  path: /metrics
  serviceMonitor:
    # Opt-in: requires Prometheus Operator CRDs (monitoring.coreos.com/v1).
    # Enable per-env only where kube-prometheus-stack is installed.
    enabled: false
    namespace: ""          # empty -> chart release namespace
    interval: 30s
    scrapeTimeout: 10s
    labels: {}             # extra labels if Prometheus needs a selector match

# Autoscaling. CPU only, deliberately.
#
# Memory is left empty because it is not a usable load signal here. Bun runs on
# JavaScriptCore, whose heap grows to fill the space available and is reclaimed
# lazily, so resident memory ratchets upward and does not fall when load drops.
# Since the HPA takes the *max* of all metric recommendations, a ratcheting
# memory metric pins replicas at maxReplicas permanently and makes the CPU
# target decorative. This is not hypothetical: the production HPA sat at 2/2
# driven by memory (66%/80%) while CPU idled at 19%/60%.
#
# Memory exhaustion is handled by the container limit plus an OOM restart,
# which is the correct response to a runaway heap -- adding a replica does not
# relieve pressure on the pod that is already growing.
#
# If you do set targetMemoryUtilizationPercentage, raise resources.requests.memory
# at the same time so the idle baseline is not already near the threshold
# (at a 256Mi request, idle sits around 60-70%).
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: ""

nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables
env: []
  # - name: API_URL
  #   value: "https://api.example.com"
  # - name: NODE_ENV
  #   value: "production"

# Environment variables from secrets/configmaps
envFrom: []
  # - secretRef:
  #     name: nextjs-secrets
  # - configMapRef:
  #     name: nextjs-config

# Probe configuration.
# All three probes target `/healthz`, a static route that renders nothing and
# is excluded from the proxy matcher. They previously hit `/`, which is a
# dynamic route: the home page is a client component, so it is absent from the
# prerender manifest and every probe re-rendered the full page server-side.
# Combined with a 5s readiness period across 2 replicas that was ~24 SSR
# renders/minute/pod at idle, and measured ~10x the CPU of an equivalent app
# serving prerendered HTML.
livenessProbe:
  httpGet:
    path: /healthz
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

# Readiness probe configuration
readinessProbe:
  httpGet:
    path: /healthz
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

# Startup probe configuration (useful for slow-starting apps)
startupProbe:
  httpGet:
    path: /healthz
    port: 3000
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 30

# Pod Disruption Budget configuration
podDisruptionBudget:
  enabled: false

# Feature branch configuration
featureBranch:
  enabled: false
  portMappingNamespace: "default"
