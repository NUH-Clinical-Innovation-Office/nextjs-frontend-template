# Default values for nextjs-app
replicaCount: 1

image:
  repository: client-sample
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: ghcr-credentials

nameOverride: ""
fullnameOverride: ""

# Common labels for cost allocation and resource organization.
commonLabels: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Node has no JVM-style heap flag; cap the V8 old-space via NODE_OPTIONS so the
# heap stays well under the container memory limit (avoids OOMKills before GC
# kicks in). Set to ~75% of resources.limits.memory.
nodeOptions:
  maxOldSpaceSizeMiB: 192

nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables.
env: []

# Injected at deployment time (COMMON_SERVICE_URL).
extraEnv: []

# Developer API key used to authenticate against common-service as a Consumer
# Backend. Referenced from an existing Secret so the credential never appears
# in a values file. Leave secretName empty to omit the variable entirely, in
# which case the app falls back to requiring a caller-supplied bearer token.
#
# Create the Secret out of band, e.g.
#   kubectl create secret generic client-sample-common-service \
#     --from-literal=api-key=<key> -n sample-services
commonServiceApiKey:
  secretName: ""
  secretKey: "api-key"

# Environment variables from secrets/configmaps.
envFrom: []

# OpenTelemetry. Disabled by default: without a collector the browser SDK stays
# off and the /telemetry/* routes answer with {"disabled": true}.
otel:
  enabled: false
  # Collector base URL, no /v1/<signal> suffix — the proxy appends it.
  collectorUrl: ""
  # Identity forced onto every batch server-side, overriding client-supplied
  # values so a tampered browser cannot masquerade as another service.
  serviceName: "client-sample"
  environment: "development"
  tenant: "client-sample"

# Pulls the collector's bearer credential from Parameter Store into a Secret.
# Requires external-secrets and the namespace SecretStore to exist.
otelExternalSecret:
  enabled: false
  secretName: "otel-client-sample-api-key"
  remoteKey: "/nuh-cio/otel/proxies/client-sample"
  remoteProperty: "api-key"

# Prometheus scrape endpoint for the Next.js server process. Served on its own
# port so it is reachable in-cluster without going through the public ingress.
# `path` must match DEFAULT_METRICS_PATH in src/telemetry/metrics-server.ts.
metrics:
  enabled: false
  port: 9464
  path: /metrics
  # Requires the Prometheus Operator CRD. Off by default so the chart installs
  # on a cluster without kube-prometheus-stack.
  serviceMonitor:
    enabled: false
    # Defaults to the release namespace.
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

# Namespace running Prometheus, used by the metrics ingress rule.
monitoring:
  namespace: nuh-cio

# AWS VPC CNI NetworkPolicy. Disabled by default so the chart stays usable on
# clusters without a policy controller; deployed environments enable it.
networkPolicy:
  enabled: false
  dns:
    namespaceSelector:
      kubernetes.io/metadata.name: kube-system
    podSelector:
      k8s-app: kube-dns
  # Outbound to common-service, the Common Service this app calls.
  commonServiceEgress:
    enabled: true
    # Empty namespace means "same namespace as this release".
    namespace: ""
    podLabelName: common-service-sample
    port: 8080
  otelCollector:
    namespace: nuh-cio
    # This app proxies browser telemetry over OTLP/HTTP, which the collector
    # exposes on a per-proxy authenticated port rather than the shared 4317.
    # Must match otel.collectorUrl, or exports are dropped at L3/L4 with no
    # application-level error.
    port: 4322
    podSelector:
      app.kubernetes.io/name: opentelemetry-collector
  additionalIngress: []
  additionalEgress: []

livenessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 30
