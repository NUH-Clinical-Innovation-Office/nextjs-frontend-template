# Default values for nextjs-app
replicaCount: 1

image:
  repository: client-sample
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: ghcr-credentials

nameOverride: ""
fullnameOverride: ""

# Common labels for cost allocation and resource organization.
commonLabels: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Node has no JVM-style heap flag; cap the V8 old-space via NODE_OPTIONS so the
# heap stays well under the container memory limit (avoids OOMKills before GC
# kicks in). Set to ~75% of resources.limits.memory.
nodeOptions:
  maxOldSpaceSizeMiB: 192

nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables.
env: []

# Injected at deployment time (COMMON_SERVICE_URL).
extraEnv: []

# Environment variables from secrets/configmaps.
envFrom: []

livenessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 30
