# Feature branch environment values (template)
replicaCount: 1

# Common labels for cost allocation and resource organization
commonLabels:
  team: "frontend-team"
  project: "nextjs-frontend-template"
  cost-center: "engineering"
  environment: "development"

image:
  repository: nextjs-frontend-template
  pullPolicy: IfNotPresent
  tag: "feature"

service:
  type: NodePort
  port: 3000
  nodePort: 0  # Kubernetes allocates an available port

serviceAccount:
  create: true
  annotations: {}
  name: "nextjs-frontend-template-feature"

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: "nextjs-frontend-template"
  vault.hashicorp.com/agent-inject-secret-env.json: "secret/data/nextjs-frontend-template/development"
  vault.hashicorp.com/agent-inject-template-env.json: |
    {{- with secret "secret/data/nextjs-frontend-template/development" -}}
    {{ .Data.data | toJSON }}
    {{- end -}}

vaultSecrets:
  file: /vault/secrets/env.json

env:
  - name: NODE_ENV
    value: "production"
  - name: NEXT_PUBLIC_ENV
    value: "development"

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 150m
    memory: 256Mi

# Keep Bun's GC aggressive under the 256Mi memory limit above.
bunOptions:
  smol: true

ingress:
  enabled: false

autoscaling:
  enabled: false

featureBranch:
  enabled: true
  portMappingNamespace: "default"
