# Production environment values
replicaCount: 2

# Common labels for cost allocation and resource organization
commonLabels:
  team: "frontend-team"
  project: "nextjs-frontend-template"
  cost-center: "engineering"
  environment: "production"

image:
  repository: nextjs-frontend-template
  pullPolicy: Always
  tag: "latest"

service:
  type: NodePort
  port: 3000
  nodePort: 30001

serviceAccount:
  create: true
  annotations: {}
  name: "nextjs-frontend-template"

podAnnotations: {}

env:
  - name: NODE_ENV
    value: "production"
  - name: NEXT_PUBLIC_ENV
    value: "production"

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 150m
    memory: 256Mi

# Keep Bun's GC aggressive under the 256Mi memory limit above.
bunOptions:
  smol: true

ingress:
  enabled: false

# CPU only -- see the autoscaling note in values.yaml for why memory is unset.
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 1
