# Production environment values
replicaCount: 2

# Common labels for cost allocation and resource organization
commonLabels:
  team: "frontend-team"
  project: "nextjs-frontend-template"
  cost-center: "engineering"
  environment: "production"

image:
  repository: nextjs-frontend-template
  pullPolicy: Always
  tag: "latest"

service:
  type: NodePort
  port: 3000
  nodePort: 30001

serviceAccount:
  create: true
  annotations:
    # Required for Vault integration
  name: "nextjs-frontend-template"

# Vault Agent Injector annotations
podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: "nextjs-frontend-template"
  vault.hashicorp.com/agent-inject-secret-env.json: "secret/data/nextjs-frontend-template/production"
  vault.hashicorp.com/agent-inject-template-env.json: |
    {{- with secret "secret/data/nextjs-frontend-template/production" -}}
    {{ .Data.data | toJSON }}
    {{- end -}}

vaultSecrets:
  file: /vault/secrets/env.json

env:
  - name: NODE_ENV
    value: "production"
  - name: NEXT_PUBLIC_ENV
    value: "production"

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 150m
    memory: 256Mi

# Keep Bun's GC aggressive under the 256Mi memory limit above.
bunOptions:
  smol: true

ingress:
  enabled: false

# CPU only -- see the autoscaling note in values.yaml for why memory is unset.
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 1
