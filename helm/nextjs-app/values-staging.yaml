# Staging environment values
replicaCount: 1

# Common labels for cost allocation and resource organization
commonLabels:
  team: "frontend-team"
  project: "nextjs-frontend-template"
  cost-center: "engineering"
  environment: "staging"

image:
  repository: nextjs-frontend-template
  pullPolicy: IfNotPresent
  tag: "staging"

service:
  type: NodePort
  port: 3000
  nodePort: 30002

serviceAccount:
  create: true
  annotations:
    # Required for Vault integration
  name: "nextjs-frontend-template"

# Vault Agent Injector annotations
podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: "nextjs-frontend-template"
  vault.hashicorp.com/agent-inject-secret-env.json: "secret/data/nextjs-frontend-template/staging"
  vault.hashicorp.com/agent-inject-template-env.json: |
    {{- with secret "secret/data/nextjs-frontend-template/staging" -}}
    {{ .Data.data | toJSON }}
    {{- end -}}

vaultSecrets:
  file: /vault/secrets/env.json

env:
  - name: NODE_ENV
    value: "production"
  - name: NEXT_PUBLIC_ENV
    value: "staging"

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 150m
    memory: 256Mi

# Keep Bun's GC aggressive under the 256Mi memory limit above.
bunOptions:
  smol: true

ingress:
  enabled: false

# CPU only -- see the autoscaling note in values.yaml for why memory is unset.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: ""

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
