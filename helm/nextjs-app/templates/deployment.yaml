{{- include "nextjs-app.validateImageTag" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nextjs-app.fullname" . }}
  labels:
    {{- include "nextjs-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nextjs-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "nextjs-app.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nextjs-app.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        {{- if .Values.metrics.enabled }}
        - name: metrics
          containerPort: {{ .Values.metrics.port }}
          protocol: TCP
        {{- end }}
        {{- if .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 12 }}
        {{- end }}
        {{- if .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 12 }}
        {{- end }}
        {{- if .Values.startupProbe }}
        startupProbe:
          {{- toYaml .Values.startupProbe | nindent 12 }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        {{- if or .Values.nodeOptions.maxOldSpaceSizeMiB .Values.env .Values.extraEnv .Values.commonServiceApiKey.secretName .Values.otel.enabled .Values.metrics.enabled }}
        env:
          {{- if .Values.nodeOptions.maxOldSpaceSizeMiB }}
            - name: NODE_OPTIONS
              value: "--max-old-space-size={{ .Values.nodeOptions.maxOldSpaceSizeMiB }}"
          {{- end }}
          {{- if .Values.metrics.enabled }}
            - name: METRICS_ENABLED
              value: "true"
            - name: METRICS_PORT
              value: "{{ .Values.metrics.port }}"
            - name: METRICS_PATH
              value: {{ .Values.metrics.path | quote }}
          {{- end }}
          {{- if .Values.otel.enabled }}
            # Keep the runtime flag aligned with the build-time browser flag.
            - name: NEXT_PUBLIC_OTEL_ENABLED
              value: "true"
            - name: OTLP_COLLECTOR_URL
              value: {{ .Values.otel.collectorUrl | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}
            - name: OTEL_DEPLOYMENT_ENVIRONMENT
              value: {{ .Values.otel.environment | quote }}
            - name: OTEL_TENANT
              value: {{ .Values.otel.tenant | quote }}
            {{- if .Values.otelExternalSecret.enabled }}
            # optional: telemetry must never gate startup. Without this the
            # kubelet refuses to create the container until the Secret exists,
            # so an unsynced ExternalSecret (missing Parameter Store entry,
            # external-secrets down, IAM denial) holds the pod in
            # CreateContainerConfigError indefinitely. Unset, the proxy simply
            # forwards without an Authorization header.
            - name: OTEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otelExternalSecret.secretName }}
                  key: api-key
                  optional: true
            {{- end }}
          {{- end }}
          {{- with .Values.env }}
          {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.extraEnv }}
          {{- toYaml . | nindent 12 }}
          {{- end }}
          {{/*
          The common-service API key is a credential, so it is referenced from
          an existing Secret rather than templated in as a literal value. That
          keeps it out of the chart, out of values files, and out of
          `helm get values` output.
          */}}
          {{- with .Values.commonServiceApiKey }}
          {{- if .secretName }}
            - name: COMMON_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey | default "api-key" }}
          {{- end }}
          {{- end }}
        {{- end }}
        {{- with .Values.envFrom }}
        envFrom:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- if .Values.securityContext.readOnlyRootFilesystem }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: nextjs-cache
          mountPath: /app/.next/cache
        {{- end }}
      {{- if .Values.securityContext.readOnlyRootFilesystem }}
      volumes:
      - name: tmp
        emptyDir: {}
      - name: nextjs-cache
        emptyDir: {}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
