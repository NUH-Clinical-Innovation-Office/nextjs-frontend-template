{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nextjs-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nextjs-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nextjs-app.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # The application port is left open to any source because the ALB targets
    # pod IPs directly (target-type: ip) from outside the cluster, and its
    # node addresses are not stable enough to enumerate here. This is a
    # public site, so the port is reachable from the internet by design.
    - ports:
        - { protocol: TCP, port: {{ .Values.service.targetPort }} }
    {{- if .Values.metrics.enabled }}
    # Prometheus scrapes the metrics port. Namespace-scoped rather than
    # pod-scoped because the scraper's pod labels vary by chart and release.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoring.namespace | quote }}
      ports:
        - { protocol: TCP, port: {{ .Values.metrics.port }} }
    {{- end }}
    {{- with .Values.networkPolicy.additionalIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # DNS. Without it every rule below fails at name resolution rather than
    # at connect, which is far harder to read in the logs.
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 14 }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- if .Values.networkPolicy.commonServiceEgress.enabled }}
    # common-service. This is the Consumer Backend call this app exists to
    # make: it exchanges its developer API key and reads the todo resource
    # server-side. common-service's own policy admits this pod by name, so
    # the two must agree on this pod's app.kubernetes.io/name label.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.networkPolicy.commonServiceEgress.podLabelName | quote }}
          {{- with .Values.networkPolicy.commonServiceEgress.namespace }}
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
          {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.networkPolicy.commonServiceEgress.port }} }
    {{- end }}
    {{- if .Values.otel.enabled }}
    # OTLP export to the shared collector. Browser telemetry is proxied by
    # this Next.js server rather than sent direct, so this is the only path
    # traces take out of the pod.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.otelCollector.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.otelCollector.podSelector | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.networkPolicy.otelCollector.port }} }
    {{- end }}
    {{- with .Values.networkPolicy.additionalEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
