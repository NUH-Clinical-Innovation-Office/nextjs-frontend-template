{{- if .Values.otelExternalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.otelExternalSecret.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nextjs-app.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ .Release.Namespace }}-secrets-ssm
  target:
    name: {{ .Values.otelExternalSecret.secretName }}
    creationPolicy: Owner
    # Keep the shared credential when this chart is uninstalled.
    deletionPolicy: Retain
    template:
      data:
        api-key: "{{`{{ .api_key }}`}}"
      engineVersion: v2
  data:
    - secretKey: api_key
      remoteRef:
        key: {{ .Values.otelExternalSecret.remoteKey | quote }}
        property: {{ .Values.otelExternalSecret.remoteProperty | quote }}
{{- end }}
